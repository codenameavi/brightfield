<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embedded Google Sheet</title>
    <style>
        /* Reset and base styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #f5f7fa, #c3cfe2);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: fixed;
            z-index: 100;
            width: 100%;
            background-color: #1f3c88;
            color: white;
            padding: 1rem 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.8rem;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .iframe-wrapper {
            position: absolute;
            top: -124px;
            width: 100%;
            max-width: 1200px;
            height: 125vh;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.4rem;
            }

            .iframe-wrapper {
                /* height: 75vh; */
                top: 16px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 1rem;
            }

            .iframe-wrapper {
                /* height: 70vh; */
                top: 16px;
            }
        }
    </style>
</head>

<body>
    <header>
        <a style="position:absolute; top:25px; left:9px; color: white;" href="index.html">
            HOME
        </a>
        <h4 id="header-text">Loading...</h4>
        <h4>20-50-200 DMA Strategy <br/>Mid & Large Caps</h4>
    </header>
    <div class="container">
        <div class="iframe-wrapper">
            <iframe
                src="https://docs.google.com/spreadsheets/d/1dKDW2XW4pJNqM67f7Q34d71c-5ReWdKl6HZXWfagPko/edit?usp=sharing"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        const headerEl = document.getElementById("header-text");
        const date = new Date();
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "June",
            "July", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const month = months[date.getMonth()];
        const year = date.getFullYear();
        headerEl.textContent = `${month}, ${year}`;
    </script>
</body>

</html>
