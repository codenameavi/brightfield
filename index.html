<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Strategies for Monthly Investments</title>
  <!-- Font Awesome CDN (Reliable version) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-p1CmZ2sG+m8VbxJY2O8XLZV6Wtz1IYoN/0u0V1Bg4ldg+vXjZ2z4k3bnZgHNGKmDgRbf5frJMSsKZH1ZkV9Yxg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --bg: #e0eafc;
      --bg-gradient: linear-gradient(to right, #e0eafc, #cfdef3);
      --card-bg: #fff;
      --text: #1f3c88;
      --card-border: #1f3c88;
    }

    body.dark {
      --bg: #121212;
      --bg-gradient: linear-gradient(to right, #1c1c1c, #2a2a2a);
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --card-border: #4a90e2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      transition: background 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-border);
      padding: 1.2rem;
      text-align: center;
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .toggle-switch {
      position: absolute;
      top: 50%;
      right: 1rem;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.2rem;
      color: white;
      transition: transform 0.3s ease;
    }

    .toggle-switch:hover {
      transform: translateY(-50%) scale(1.1);
    }

    main {
      flex: 1;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 600px;
      margin: auto;
      transition: background 0.4s ease;
    }

    .card {
      background: var(--card-bg);
      padding: 1rem 1.2rem;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.4s ease, color 0.4s ease;
      text-align: left;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      border-left: 4px solid var(--card-border);
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .card i {
      font-size: 1.4rem;
      min-width: 24px;
    }

    .card:hover {
      transform: translateX(4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      background-color: rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 480px) {
      header {
        font-size: 1.4rem;
      }
      .card {
        font-size: 0.95rem;
      }
    }

    /* Loader styles */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: var(--bg-gradient);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    #loader i {
      font-size: 2.5rem;
      color: var(--card-border);
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loader">
    <i class="fas fa-spinner"></i>
  </div>

  <header>
    Strategies for Monthly Investments
    <div class="toggle-switch" onclick="toggleMode()">
      <i id="modeIcon" class="fas fa-moon"></i>
    </div>
  </header>

  <main>
    <a href="1_yearly_swing.html" class="card">
      <i class="fas fa-chart-line"></i>
      Yearly Low to High Swing Strategy <br/>Large Caps
    </a>
    <a href="2_dma_strategy.html" class="card">
      <i class="fas fa-wave-square"></i>
      20-50-200 Day Moving Average Strategy <br/>Mid & Large Caps
    </a>
    <a href="#below-200dma" class="card">
      <i class="fas fa-arrow-down"></i>
      Below 200 DMA Swing Strategy <br/>Large Caps
    </a>
    <a href="#v20-strategy" class="card">
      <i class="fas fa-bolt"></i>
      V20 Strategy <br/>All Caps
    </a>
    <a href="#financial-highs" class="card">
      <i class="fas fa-building-columns"></i>
      Companies with Ever Highest Financials
    </a>
  </main>

  <script>
    const icon = document.getElementById("modeIcon");

    function toggleMode() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      icon.classList.toggle("fa-moon", !isDark);
      icon.classList.toggle("fa-sun", isDark);
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    // Load saved theme preference
    window.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark");
        icon.classList.remove("fa-moon");
        icon.classList.add("fa-sun");
      }

      // Hide loader after short delay
      setTimeout(() => {
        document.getElementById("loader").classList.add("hidden");
      }, 800); // delay for smooth effect
    });
  </script>

</body>
</html>
